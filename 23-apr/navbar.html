<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        li{
            list-style: none;
            display: inline;
            padding: 20px;
            cursor: pointer;
        }

        li{
            position: relative;
        }

        li:hover:after{
            content: "";
            position: 
            absolute;
            color: green;
            top: 40px;
            left: 20px;
            width: 50px;
            height: 2px;
            background-color: green;
        }
    </style>
</head>
<body>
    <ul>
        <li>Home</li>
        <li>Services</li>
    </ul>
</body>
</html>
