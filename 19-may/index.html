<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Interval, dates etc</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <button id="btn">Click</button>
    <h2 id="demo"></h2>
</body>
</html>

<script>
    function date_func()
    {
        let d = new Date();
        document.getElementById('demo').innerHTML = d.getHours() +":" +d.getMinutes() + ":" + d.getSeconds()
    }


    document.getElementById('btn').addEventListener('click', (e) => { 
        setInterval(date_func, 1000)
        console.log(e)
    })

</script>
